# EDM ZCO - Local Development Configuration
# --------------------------------------------------------
# Lokalny dev: backend + frontend budowane z Dockerfiles
# Połączenie do services na Spark (192.168.1.34)
# --------------------------------------------------------

services:
  # === BACKEND (budowane z Dockerfile, łączy się do Spark PG) ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      # Mount source code — zmiany widoczne od razu (uvicorn --reload)
      - ./backend/app:/app/app
      # Klucz SSH do transferu plików na Sparka (dev mode)
      - ./spark-deploy/id_ed25519.spark:/app/ssh/id_ed25519.spark:ro
      # Lokalny cache plików — trwały między rebuildami kontenera
      # (upload zapisuje tu kopię przed transferem SSH na Sparka)
      - ./shared_docs:/data/shared_docs
    env_file:
      - ./backend/.env.dev
    environment:
      # Adres pod którym n8n (na Sparku) odsyła statusy do TEGO backendu.
      # Dev: IP tego komputera w LAN + port 8001. Na Sparku (prod) default: http://192.168.1.34:8083
      - BACKEND_CALLBACK_URL=http://192.168.1.17:8001
      # Transfer wgranych plików przez SSH do wolumenu shared_docs na Sparku,
      # aby n8n (na Sparku) widział je pod /data/shared_docs/... (dev only)
      - SPARK_SSH_TRANSFER=true
      - SPARK_SSH_HOST=192.168.1.34
      - SPARK_SSH_USER=marcin
      - SPARK_SSH_KEY_PATH=/app/ssh/id_ed25519.spark
      - SPARK_DOCKER_CONTAINER=edm-backend
      - SPARK_SHARED_DIR=/data/shared_docs
    ports:
      - "8001:8000"

  # === FRONTEND (budowane z Dockerfile, łączy się do local backend) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://host.docker.internal:8001
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    volumes:
      # Hot reload dla Next.js
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/package.json:/app/package.json
      - ./frontend/.env:/app/.env
    depends_on:
      - backend
    ports:
      # Porty 8000, 3000 zajęte — używamy 8001, 3002
      - "3002:3000"


# =====================================================
# Uwagi:
# =====================================================
# 1. Backend łączy się do PostgreSQL na Sparku:
#    - Host: 192.168.1.34
#    - Port: 5433 (mapped from container 5432)
#    - User: postgres / tajne_haslo
#    - DB: edmdatabase
#
# 2. Backend łączy się do Spark services:
#    - n8n: http://192.168.1.34:5678
#    - Qdrant: http://192.168.1.34:6333
#    - Docling: http://127.0.0.1:8002 (docker host)
#    - Ollama: http://192.168.1.34:11434
#
# 3. Frontend łączy się do local backend:
#    - NEXT_PUBLIC_API_URL=http://localhost:8000
#
# 4. Porty lokalne:
#    - Backend:  http://localhost:8000
#    - Frontend: http://localhost:3001 (port 3000 zajęty!)
#
# 5. Start: docker compose -f docker-compose.dev.yaml up -d
#    Dev mode (zmiany widoczne od razu):
#    docker compose -f docker-compose.dev.yaml up backend frontend
#    Stop: docker compose -f docker-compose.dev.yaml down
# =====================================================