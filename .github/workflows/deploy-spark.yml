name: Deploy to Spark

on:
  push:
    branches: [main, spark, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # IMPORTANT: Docker image names MUST be lowercase — github.repository may contain uppercase
  IMAGE_REPO: ${{ github.repository }}
  SPARK_SSH_HOST: 192.168.1.34
  SPARK_SSH_USER: marcin

jobs:
  # ============================================================
  # TESTY BACKEND
  # ============================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Część testów uruchamia aplikację przez TestClient, a ta przy starcie łączy
    # się z bazą (create_all + uaktualnienia schematu). Bez bazy w przebiegu CI
    # kończyły się błędem połączenia — wcześniej nie było tego widać, bo krok
    # z testami miał `|| true`. Port 15432 jest celowy: taki jest domyślny adres
    # bazy w app/config.py, więc nie trzeba podawać DATABASE_URL.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: tajne_haslo
          POSTGRES_DB: edmdatabase
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      # Czerwony test BLOKUJE wdrożenie. Do 2026-08-15 stało tu `|| true` razem
      # z `continue-on-error`, więc cały pakiet mógł się wywalić, a wdrożenie i tak
      # szło dalej — dwie nieaktualne asercje przeleżały tak tygodnie. Siatka
      # bezpieczeństwa, która nie zatrzymuje upadku, nie jest siatką.
      - name: Run tests with pytest
        working-directory: ./backend
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # ============================================================
  # WERSJONOWANIE — ręczne, świadome (nie auto-bump).
  # ------------------------------------------------------------
  # Jedno źródło prawdy: backend/app/changelog.json (górny wpis = bieżąca wersja).
  # Wersję ustawiamy MY, dopisując wpis do changeloga w tym samym commicie co
  # zmiany. build-deploy czyta numer z changeloga i wpieka go do obrazu (build-arg
  # VERSION). Wcześniejszy auto-bump usunięto (nie działał, groził pętlą deployów).
  # ============================================================

  # ============================================================
  # BUILD & DEPLOY (natywnie na self-hosted ARM64 — bez QEMU)
  # ============================================================
  # Wcześniej dwa osobne joby budowały obrazy ARM64 przez emulację QEMU na
  # ubuntu-latest (x86). `npm ci` pod QEMU wywalał się z "illegal instruction"
  # i blokował cały deploy. Runner Sparka jest natywnym aarch64, więc budujemy
  # bezpośrednio na nim — bez emulacji i bez rundy przez rejestr: WDROŻENIE bierze
  # obraz z lokalnego demona, na tej samej maszynie, na której startuje compose.
  #
  # Do rejestru obraz trafia DOPIERO PO wdrożeniu (krok „Publish images"). Wcześniej
  # nie trafiał tam wcale, mimo że nazywał się `ghcr.io/...` — była to więc nazwa
  # myląca: lokalny alias wyglądający jak adres rejestru. Skutek (2026-08-10):
  # `docker compose pull` na Sparku podmienił dobry lokalny obraz na build z 15
  # czerwca leżący w rejestrze i cofnął demo z 1.0.9 do 1.0.0. Publikacja usuwa
  # tę pułapkę u źródła i jest warunkiem instalacji u klienta z rejestru.
  build-deploy:
    name: Build & Deploy on Spark (native ARM64)
    needs: [test-backend]
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    environment: spark
    permissions:
      contents: read
      packages: write        # wymagane, by GITHUB_TOKEN mógł wypchnąć obraz do ghcr
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Brakujący sekret nie może objawić się dopiero kontenerem w pętli restartów.
      # `docker compose up -d` kończy się sukcesem także wtedy, gdy aplikacja zaraz
      # potem odmawia startu — więc sprawdzamy komplet ZANIM cokolwiek ruszymy.
      - name: Check required secrets
        run: |
          BRAKI=""
          [ -z "${{ secrets.SECRET_KEY }}" ]     && BRAKI="$BRAKI SECRET_KEY"
          [ -z "${{ secrets.WEBHOOK_SECRET }}" ] && BRAKI="$BRAKI WEBHOOK_SECRET"
          [ -z "${{ secrets.N8N_AUTH_VALUE }}" ] && BRAKI="$BRAKI N8N_AUTH_VALUE"
          if [ -n "$BRAKI" ]; then
            echo "Brakuje sekretów w repozytorium:$BRAKI"
            echo "Ustaw je: gh secret set <NAZWA>"
            exit 1
          fi
          echo "Komplet sekretów obecny."

      - name: Read version
        id: version
        run: |
          VER=$(python3 -c "import json;print(json.load(open('backend/app/changelog.json'))['entries'][0]['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Deploying version $VER"

      - name: Build backend image (native arm64)
        run: |
          docker build \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t ${{ env.REGISTRY }}/marcin-ccc/zco-edm/backend:latest \
            ./backend

      - name: Build frontend image (native arm64)
        run: |
          docker build \
            --build-arg BACKEND_URL=http://backend:8000 \
            --build-arg NEXT_PUBLIC_API_URL=http://backend:8000 \
            -t ${{ env.REGISTRY }}/marcin-ccc/zco-edm/frontend:latest \
            ./frontend

      - name: Deploy on Spark
        run: |
          TARGET_DIR="/home/marcin/zco-edm-app"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Target directory $TARGET_DIR does not exist"
            exit 1
          fi
          # Plik compose bierzemy Z REPOZYTORIUM. Wcześniej wdrożenie używało kopii
          # leżącej na Sparku, która nie była niczym aktualizowana — zmiany w compose
          # (np. nowe zmienne środowiskowe) nigdy nie docierały na produkcję, a kopia
          # zdążyła się rozjechać z repo. Zachowujemy poprzednią wersję na wszelki wypadek.
          if [ -f "$TARGET_DIR/docker-compose.yaml" ]; then
            cp "$TARGET_DIR/docker-compose.yaml" "$TARGET_DIR/docker-compose.yaml.poprzedni"
          fi
          cp docker-compose.yaml "$TARGET_DIR/docker-compose.yaml"

          cd "$TARGET_DIR"

          # Obrazy zbudowane lokalnie (kroki powyżej) — compose użyje ich bez pull.
          echo "BUILD_TAG_BACKEND=${{ env.REGISTRY }}/marcin-ccc/zco-edm/backend:latest" > .env
          echo "BUILD_TAG_FRONTEND=${{ env.REGISTRY }}/marcin-ccc/zco-edm/frontend:latest" >> .env

          # Sekrety webhooków n8n z GitHub Secrets (współdzielone z dev — jedno n8n).
          # MUSZĄ zgadzać się z credentialami w n8n.
          echo "WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}" >> .env
          echo "N8N_AUTH_HEADER=X-N8N-Webhook-Secret" >> .env
          echo "N8N_AUTH_VALUE=${{ secrets.N8N_AUTH_VALUE }}" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          # Bez tego backend odmówi startu: bezpiecznik uznaje brak APP_ENV
          # za środowisko deweloperskie i nie pozwala mu tknąć zdalnej bazy.
          echo "APP_ENV=production" >> .env
          # Klucz podpisujący tokeny sesji. Do 2026-08-15 NIE był tu zapisywany,
          # więc compose podstawiał domyślkę leżącą w repozytorium — każdy, kto ją
          # znał, mógł wystawić sobie token administratora. Backend odmawia teraz
          # startu z taką wartością, więc brak tego sekretu zatrzyma wdrożenie.
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          # Absolutny backstop sesji (JWT). Główne wylogowanie = bezczynność (frontend).
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=720" >> .env

          # Marka TEJ instancji. Wartości domyślne w kodzie opisują demo uniwersalne
          # (HIRS), więc wdrożenie klienckie musi nazwać się samo — inaczej po
          # najbliższym wdrożeniu zmieniłoby nazwę i kolory.
          echo "APP_NAME=ZCO DM" >> .env
          echo "APP_DESCRIPTION=System zarządzania dokumentami" >> .env
          echo "BRAND_PRIMARY=#1d2a4d" >> .env
          echo "BRAND_ACCENT=#1fc8ba" >> .env
          echo "LOGIN_EMAIL_PLACEHOLDER=admin@zco.pl" >> .env
          echo "BRAND_HEADER_TEXT=#1fc8ba" >> .env
          # Ikona karty przeglądarki. Domyślna w kodzie należy do demo (HiRS), więc
          # wdrożenie klienckie musi wskazać własną — inaczej ZCO pokazałoby „H".
          echo "HELP_VARIANT=zco" >> .env
          echo "BRAND_ICON=/ikona-zco.png" >> .env
          echo "BRAND_ICON_APPLE=/ikona-zco-apple.png" >> .env

          # NIE drukować całego .env — zawiera sekrety. Tylko tagi obrazów.
          grep '^BUILD_TAG' .env

          docker compose --profile spark up -d backend frontend
          echo "Deployment complete!"

      - name: Verify deployment
        run: |
          echo "Checking containers..."
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo ""
          echo "Health checks..."
          sleep 5
          curl -sf --max-time 10 http://localhost:8083/api/health && echo ' - Backend OK' || echo ' - Backend FAIL'
          curl -sf --max-time 5 http://localhost:3000 > /dev/null && echo ' - Frontend OK' || echo ' - Frontend FAIL'

      # ============================================================
      # PUBLIKACJA OBRAZÓW DO REJESTRU
      # ============================================================
      # Kolejność jest celowa: NAJPIERW wdrożenie, POTEM publikacja. Wdrożenie na
      # Spark nie może zależeć od dostępności ghcr, a publikacja nie może być cicha —
      # gdy się nie powiedzie, przebieg ma być czerwony. Milcząca porażka przywróciłaby
      # dokładnie ten stan, który nas dziś ugryzł: świeży obraz lokalnie, stary
      # w rejestrze.
      #
      # Obok `latest` wypychamy tag z numerem wersji: daje możliwość przypięcia
      # konkretnego wydania u klienta i powrotu do poprzedniego bez szukania po
      # identyfikatorach obrazów.
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Publish images
        run: |
          VER="${{ steps.version.outputs.version }}"
          for OBRAZ in backend frontend; do
            SCIEZKA="${{ env.REGISTRY }}/marcin-ccc/zco-edm/$OBRAZ"
            docker tag "$SCIEZKA:latest" "$SCIEZKA:$VER"
            docker push "$SCIEZKA:$VER"
            docker push "$SCIEZKA:latest"
          done
          echo "Opublikowano wersję $VER (oraz latest)"

      - name: Log out from GHCR
        if: always()
        run: docker logout ${{ env.REGISTRY }} || true

      - name: Cleanup dangling images
        if: always()
        run: docker image prune -f 2>/dev/null || true
