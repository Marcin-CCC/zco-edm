name: Deploy to Spark

on:
  push:
    branches: [main, spark, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # IMPORTANT: Docker image names MUST be lowercase — github.repository may contain uppercase
  IMAGE_REPO: ${{ github.repository }}
  SPARK_SSH_HOST: 192.168.1.34
  SPARK_SSH_USER: marcin

jobs:
  # ============================================================
  # TESTY BACKEND
  # ============================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run tests with pytest
        working-directory: ./backend
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing || true
        continue-on-error: true

  # ============================================================
  # BUMP VERSION
  # ============================================================
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment patch version
        id: version
        run: |
          VERSION_FILE="VERSION"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "1.0.0" > "$VERSION_FILE"
          fi
          CURRENT=$(cat "$VERSION_FILE" | tr -d '[:space:]')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "$NEW_VERSION" > "$VERSION_FILE"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT -> $NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to $(cat VERSION)" || echo "No changes to commit"
          git push || echo "No changes to push"

  # ============================================================
  # BUILD & DEPLOY (natywnie na self-hosted ARM64 — bez QEMU)
  # ============================================================
  # Wcześniej dwa osobne joby budowały obrazy ARM64 przez emulację QEMU na
  # ubuntu-latest (x86). `npm ci` pod QEMU wywalał się z "illegal instruction"
  # i blokował cały deploy. Runner Sparka jest natywnym aarch64, więc budujemy
  # bezpośrednio na nim — bez emulacji i bez rundy przez rejestr (obraz
  # powstaje na tej samej maszynie, na której startuje compose).
  build-deploy:
    name: Build & Deploy on Spark (native ARM64)
    needs: [test-backend, bump-version]
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    environment: spark
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build backend image (native arm64)
        run: |
          docker build \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t ${{ env.REGISTRY }}/marcin-ccc/zco-edm/backend:latest \
            ./backend

      - name: Build frontend image (native arm64)
        run: |
          docker build \
            --build-arg BACKEND_URL=http://backend:8000 \
            --build-arg NEXT_PUBLIC_API_URL=http://backend:8000 \
            -t ${{ env.REGISTRY }}/marcin-ccc/zco-edm/frontend:latest \
            ./frontend

      - name: Deploy on Spark
        run: |
          TARGET_DIR="/home/marcin/zco-edm-app"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Target directory $TARGET_DIR does not exist"
            exit 1
          fi
          cd "$TARGET_DIR"

          # Obrazy zbudowane lokalnie (kroki powyżej) — compose użyje ich bez pull.
          echo "BUILD_TAG_BACKEND=${{ env.REGISTRY }}/marcin-ccc/zco-edm/backend:latest" > .env
          echo "BUILD_TAG_FRONTEND=${{ env.REGISTRY }}/marcin-ccc/zco-edm/frontend:latest" >> .env

          # Sekrety webhooków n8n z GitHub Secrets (współdzielone z dev — jedno n8n).
          # MUSZĄ zgadzać się z credentialami w n8n.
          echo "WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}" >> .env
          echo "N8N_AUTH_HEADER=X-N8N-Webhook-Secret" >> .env
          echo "N8N_AUTH_VALUE=${{ secrets.N8N_AUTH_VALUE }}" >> .env
          echo "LOG_LEVEL=INFO" >> .env

          # NIE drukować całego .env — zawiera sekrety. Tylko tagi obrazów.
          grep '^BUILD_TAG' .env

          docker compose --profile spark up -d backend frontend
          echo "Deployment complete!"

      - name: Verify deployment
        run: |
          echo "Checking containers..."
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo ""
          echo "Health checks..."
          sleep 5
          curl -sf --max-time 10 http://localhost:8083/api/health && echo ' - Backend OK' || echo ' - Backend FAIL'
          curl -sf --max-time 5 http://localhost:3000 > /dev/null && echo ' - Frontend OK' || echo ' - Frontend FAIL'

      - name: Cleanup dangling images
        if: always()
        run: docker image prune -f 2>/dev/null || true
