version: '3.8'

# ============================================================
# ENVIRONMENT VARIABLES (.env file support)
# ============================================================
# Create .env file with:
#   BACKEND_PORT=8083
#   FRONTEND_PORT=3000
#   NEXT_PUBLIC_API_URL=http://172.17.0.1:8083
#   DATABASE_URL=postgresql+psycopg2://postgres:tajne_haslo@edm-zco-postgres:5432/edmdatabase
#   SECRET_KEY=your-secret-key
#   QDRANT_URL=http://192.168.1.34:6333
#   N8N_WEBHOOK_URL=http://192.168.1.34:5678/webhook/document-uploaded
#   DOCLING_API_URL=http://192.168.1.34:8085
#   OLLAMA_API_URL=http://192.168.1.34:11434
#   ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
# ============================================================

services:
  # ============================================================
  # FRONTEND (Next.js - Interfejs Uzytkownika)
  # ============================================================
  frontend:
    image: ${BUILD_TAG_FRONTEND:-ghcr.io/Marcin-CCC/zco-edm/frontend:latest}
    container_name: edm-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
      # Marka instancji — czytana przy żądaniu, więc ten sam obraz obsługuje demo
      # uniwersalne (HIRS) i wdrożenia klienckie. Brak zmiennej = wartości domyślne.
      - APP_NAME=${APP_NAME:-HiRS}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-Hospital Information Retrieval System}
      - BRAND_PRIMARY=${BRAND_PRIMARY:-#1d2a4d}
      - BRAND_ACCENT=${BRAND_ACCENT:-#1fc8ba}
      - LOGIN_EMAIL_PLACEHOLDER=${LOGIN_EMAIL_PLACEHOLDER:-admin@firma.pl}
      - BRAND_HEADER_TEXT=${BRAND_HEADER_TEXT:-#ffffff}
      # Ikona karty przeglądarki. Wartość domyślna należy do demo, więc
      # wdrożenie klienckie MUSI podać własną — inaczej ZCO pokaże „H".
      # Który komplet instrukcji pokazuje menu Instrukcja (public/pomoc/<wariant>).
      - HELP_VARIANT=${HELP_VARIANT:-hirs}
      - BRAND_ICON=${BRAND_ICON:-/ikona-hirs.svg}
      - BRAND_ICON_APPLE=${BRAND_ICON_APPLE:-/ikona-hirs.png}
    depends_on:
      backend:
        condition: service_started
    networks:
      - edm_network
    restart: unless-stopped
    profiles: ["dev", "spark"]

  # ============================================================
  # BACKEND API (FastAPI - Mszog operacyjny)
  # ============================================================
  backend:
    image: ${BUILD_TAG_BACKEND:-ghcr.io/Marcin-CCC/zco-edm/backend:latest}
    container_name: edm-backend
    ports:
      - "${BACKEND_PORT:-8083}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:tajne_haslo@edm-zco-postgres:5432/edmdatabase}
      # To JEST produkcja — bezpiecznik w app/config.py przepuszcza zdalną
      # bazę tylko przy tej wartości. Zmienna musi istnieć w TRZECH miejscach:
      # tu, w compose drugiej instancji i w .env pisanym przez CI.
      - APP_ENV=${APP_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-zco-edm-secret-key-change-in-production}
      - QDRANT_URL=${QDRANT_URL:-http://192.168.1.34:6333}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://192.168.1.34:5678/webhook/document-uploaded}
      # Dokumenty MUSZĄ być pod /data/shared_docs: w bazie zapisane są ścieżki
      # bezwzględne, a n8n montuje ten sam wolumen dokładnie tam. Zmiana punktu
      # montowania zrywa podgląd i pobieranie wszystkich wgranych plików.
      - STORAGE_PATH=/data/shared_docs
      # Adres Doclinga potrzebny jest WYLACZNIE panelowi „Status systemu" na
      # Dashboardzie. Sciezka parsowania idzie n8n -> Docling i backend jej nie
      # dotyka, dlatego dawny „http://docling:8002" (nazwa kontenera z ukladu,
      # ktory dawno nie istnieje) przez lata nikomu nie przeszkadzal.
      - DOCLING_API_URL=${DOCLING_API_URL:-http://192.168.1.34:8085}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://192.168.1.34:11434}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - N8N_AUTH_HEADER=${N8N_AUTH_HEADER:-X-N8N-Webhook-Secret}
      - N8N_AUTH_VALUE=${N8N_AUTH_VALUE:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_NAME=${APP_NAME:-HiRS}
    volumes:
      - shared_docs:/data/shared_docs
    networks:
      - edm_network
    restart: unless-stopped
    profiles: ["dev", "spark"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # POSTGRESQL (Baza Danych - Spark DGX)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: edm-zco-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tajne_haslo
      POSTGRES_DB: edmdatabase
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - edm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles: ["dev", "spark"]

# ============================================================
# VOLUMES I SIEC
# ============================================================

volumes:
  pgdata:
    driver: local
  shared_docs:
    driver: local

networks:
  edm_network:
    driver: bridge